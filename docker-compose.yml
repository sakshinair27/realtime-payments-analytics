# Default (`docker compose up -d`): Kafka + local Postgres warehouse + the app services.
# Snowflake path (`docker compose --profile snowflake up -d`): adds Kafka Connect with the
# Snowflake sink connector, which lands the topic into RAW_TRANSACTIONS via internal stage + Snowpipe.

x-app: &app
  build: .
  image: fintech-txn-app:latest
  env_file: [.env]
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic transactions --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic transactions"
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
      POSTGRES_DB: fintech
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./warehouse/local/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d fintech"]
      interval: 5s
      retries: 20

  generator:
    <<: *app
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    command: ["python", "generator/generator.py", "--bootstrap", "kafka:29092"]

  # Local stand-in for Snowpipe: micro-batches the topic into raw.raw_transactions.
  local-sink:
    <<: *app
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    command: ["python", "warehouse/local/sink.py", "--bootstrap", "kafka:29092"]
    environment: { PGHOST: postgres, PGPORT: "5432" }

  dbt-runner:
    <<: *app
    depends_on: { postgres: { condition: service_healthy } }
    command: ["python", "scripts/dbt_loop.py"]
    environment: { PGHOST: postgres, PGPORT: "5432" }

  dashboard:
    <<: *app
    depends_on: { postgres: { condition: service_healthy } }
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    environment: { PGHOST: postgres, PGPORT: "5432" }
    ports: ["8501:8501"]

  kafka-connect:
    profiles: [snowflake]
    image: confluentinc/cp-kafka-connect:7.7.1
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    ports: ["8083:8083"]
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: snowflake-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    command: >
      bash -c "confluent-hub install --no-prompt snowflakeinc/snowflake-kafka-connector:2.5.0 &&
      /etc/confluent/docker/run"

volumes:
  pgdata:
