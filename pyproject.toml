[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/logs", "*.ipynb"]  # notebook is generated by build_notebook.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]  # scripts add the repo root to sys.path before importing project modules

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebook.py" = ["E501"]  # long lines are Markdown prose for the notebook
